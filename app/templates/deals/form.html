{% extends "base.html" %}
{% block title %}{% if deal %}Сделка{% else %}Новая сделка{% endif %} — Mini-CRM{% endblock %}
{% block content %}
<h1>{% if deal %}Редактирование сделки{% else %}Новая сделка{% endif %}</h1>
<form class="card stack" method="post" action="{% if deal %}/deals/{{ deal.id }}/edit{% else %}/deals/new{% endif %}">
  <label>Название *<input name="title" required maxlength="200" value="{{ deal.title if deal else '' }}"></label>
  <label>ID клиента (необязательно)
    <input name="client_id" type="number"
           value="{{ deal.client_id if deal and deal.client_id else (client_id or '') }}">
  </label>
  <div class="grid-2">
    <label>Сумма<input name="amount" value="{{ deal.amount if deal and deal.amount is not none else '' }}"></label>
    <label>Плановая дата закрытия
      <input type="date" name="expected_close_date"
             value="{{ deal.expected_close_date if deal and deal.expected_close_date else '' }}">
    </label>
  </div>
  <label>Статус
    <select name="status">
      {% for s in statuses %}
      <option value="{{ s.value }}" {% if deal and deal.status==s %}selected{% endif %}>{{ DEAL_STATUS_LABELS[s.value] }}</option>
      {% endfor %}
    </select>
  </label>
  {% if deal %}
  <label>Причина проигрыша<input name="lost_reason" value="{{ deal.lost_reason or '' }}"></label>
  {% endif %}
  <label>Описание<textarea name="description">{{ deal.description if deal else '' }}</textarea></label>
  <div class="actions">
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn" href="{% if deal %}/deals/{{ deal.id }}{% else %}/deals{% endif %}">Отмена</a>
  </div>
</form>
{% endblock %}
